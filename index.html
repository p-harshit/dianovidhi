<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diano-Vidhi | Intellectual Property Law</title>
    <style>
        /* CSS STYLES - Premium Palette */
        :root {
            --primary-navy: #00264d;
            --accent-slate: #005073;
            --light-bg: #f9f9f9;
            --text-dark: #333333;
            --white: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Georgia', serif; 
            font-weight: normal;
        }

        /* Navigation */
        header {
            background-color: var(--white);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-navy);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-family: 'Georgia', serif;
            color: var(--primary-navy);
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav a {
            margin-left: 30px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
        }

        nav a:hover {
            color: var(--accent-slate);
        }

        /* Hero Section */
        .hero {
            background-color: var(--primary-navy);
            color: var(--white);
            padding: 120px 50px;
            text-align: center;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 20px;
            font-weight: 300;
            margin-bottom: 30px;
            color: #d9e6f2;
        }

        /* Section Formatting */
        .section-container {
            padding: 80px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            color: var(--primary-navy);
            font-size: 32px;
            border-bottom: 2px solid var(--accent-slate);
            padding-bottom: 10px;
            margin-bottom: 40px;
        }

        /* Insights & News Grid */
        .insights-grid {
            display: flex;
            gap: 50px;
        }

        .news-column, .linkedin-column {
            flex: 1;
        }

        .news-column h3, .linkedin-column h3 {
            font-size: 24px;
            color: var(--primary-navy);
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        /* News Items */
        .news-item {
            margin-bottom: 30px;
        }

        .news-item .date {
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            font-family: sans-serif;
        }

        .news-item h4 {
            margin: 8px 0;
            font-size: 20px;
        }

        .news-item h4 a {
            color: var(--primary-navy);
            text-decoration: none;
        }

        .news-item h4 a:hover {
            color: var(--accent-slate);
            text-decoration: underline;
        }
        
        .news-item p {
            font-size: 15px;
            color: #555;
            margin-top: 5px;
        }

        /* LinkedIn Posts */
        .linkedin-post {
            background: var(--light-bg);
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }

        .linkedin-post:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--primary-navy);
            font-family: sans-serif;
        }

        .badge {
            background: #0077b5;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .post-content {
            font-size: 15px;
            margin-bottom: 20px;
            color: #444;
        }

        .read-more {
            font-size: 14px;
            color: var(--accent-slate);
            text-decoration: none;
            font-weight: bold;
            font-family: sans-serif;
        }

        .read-more:hover {
            text-decoration: underline;
        }

        /* Attorney Profile */
        .attorney-profile {
            display: flex;
            gap: 40px;
            background-color: var(--light-bg);
            padding: 40px;
            border-radius: 4px;
        }

        .attorney-bio {
            flex: 1;
        }

        /* Contact Section */
        .contact-box {
            background-color: var(--primary-navy);
            color: var(--white);
            padding: 60px 20px;
            text-align: center;
        }

        .contact-box a {
            color: var(--white);
            text-decoration: none;
            font-weight: bold;
        }

        /* Footer & Counter */
        footer {
            background-color: #1a1a1a;
            color: #ccc;
            text-align: center;
            padding: 30px;
            font-size: 14px;
        }

        .visitor-counter {
            margin-top: 15px;
            font-family: monospace;
            background: #333;
            padding: 8px 15px;
            border-radius: 4px;
            display: inline-block;
            font-size: 16px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .insights-grid {
                flex-direction: column;
            }
            header {
                flex-direction: column;
                gap: 15px;
            }
            nav a {
                margin: 0 10px;
            }
        }
    </style>
</head>

            <a href="#contact">Contact</a>
        </nav>
    </header>

        <p>A boutique Intellectual Property law firm protecting your most valuable global assets.</p>
